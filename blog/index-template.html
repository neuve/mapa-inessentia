<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{pageTitle}} — Red Inessentia</title>
<meta name="description" content="{{pageDescription}}">
<meta property="og:title" content="{{pageTitle}} — Red Inessentia">
<meta property="og:description" content="{{pageDescription}}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.inessentia.mx/blog/">
<meta property="og:locale" content="{{ogLocale}}">
<link rel="canonical" href="https://www.inessentia.mx/blog/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F6F1EA;
    --deep: #2A2520;
    --warm-gray: #8B8378;
    --gold: #C9A96E;
    --light: #EDE8E0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    background: #1C1915;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .nav-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 300;
    color: var(--cream);
    letter-spacing: 0.04em;
    text-decoration: none;
  }
  .nav-brand span { color: var(--gold); font-style: italic; }
  .nav-links { display: flex; gap: 20px; }
  .nav-links a {
    font-size: 0.78rem;
    color: rgba(245,240,232,0.6);
    text-decoration: none;
    transition: color 0.15s;
    letter-spacing: 0.03em;
  }
  .nav-links a:hover { color: var(--cream); }
  .nav-links a.active { color: var(--gold); }

  main {
    flex: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 48px 24px 64px;
    width: 100%;
  }

  .blog-header {
    margin-bottom: 40px;
  }
  .blog-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 300;
    color: var(--deep);
    margin-bottom: 8px;
  }
  .blog-header h1 span { color: var(--gold); font-style: italic; }
  .blog-header p {
    font-size: 0.88rem;
    color: var(--warm-gray);
    line-height: 1.6;
  }

  .post-list { list-style: none; }

  .post-card {
    display: block;
    padding: 28px;
    background: white;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.06);
    margin-bottom: 16px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .post-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    transform: translateY(-1px);
  }

  .post-card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .post-card-date {
    font-size: 0.72rem;
    color: var(--warm-gray);
  }
  .post-card-tag {
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(201,169,110,0.15);
    color: var(--gold);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .post-card-reading {
    font-size: 0.7rem;
    color: var(--warm-gray);
  }

  .post-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--deep);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .post-card-excerpt {
    font-size: 0.85rem;
    color: var(--warm-gray);
    line-height: 1.6;
  }

  .post-card-read {
    display: inline-block;
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--gold);
    font-weight: 500;
  }

  footer {
    background: #1C1915;
    padding: 16px 24px;
    font-size: 0.72rem;
    color: rgba(245,240,232,0.5);
    line-height: 1.6;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  footer strong { color: var(--gold); font-weight: 500; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .blog-header h1 { font-size: 1.7rem; }
    .post-card { padding: 20px; }
    .post-card-title { font-size: 1.2rem; }
    main { padding: 32px 18px 48px; }
  }
</style>
</head>
<body>

<nav>
  <a href="/red-inessentia" class="nav-brand">Red <span>Inessentia</span></a>
  <div class="nav-links">
    <a href="/red-inessentia">Directorio</a>
    <a href="/blog/" class="active">Blog</a>
  </div>
</nav>

<main>
  <div class="blog-header">
    <h1>Blog <span>Inessentia</span></h1>
    <p>{{headerDescription}}</p>
  </div>

  <ul class="post-list">
{{postCards}}
  </ul>
</main>

<footer>
  <strong>Red Inessentia</strong> &mdash; Directorio de terapeutas recomendados por <a href="https://patricioruiz.mx">Patricio Ruiz</a>.
</footer>

</body>
</html>
